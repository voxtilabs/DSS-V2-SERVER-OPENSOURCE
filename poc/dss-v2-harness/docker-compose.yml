services:
  brms-gateway:
    build:
      context: ./brms-gateway
      dockerfile: Dockerfile
    ports:
      - "1443:1443"
      - "9443:9443"
      - "11443:11443"
      - "18800:18800/udp"
      - "19800:19800/udp"
      - "5080:5080/udp"
      - "9500:9500"  # ARS TCP (DVRIP/DHIP) for NVR auto-registration
      - "1883:1883"  # E-039: MQTT notify broker (brms.notify* topics, GetMqConfig MQType "mqtt")
    volumes:
      - ../certs:/certs:ro
      # E-032: the device registry (data/devices.json) MUST survive a container
      # recreation (image rebuild + `up -d`), otherwise every operator device
      # vanishes from the tree after each deploy. The bind mount also matches
      # the path used by the local dev server (brms-gateway/data/devices.json).
      - ./brms-gateway/data:/app/data
    environment:
      - PORT=11443
      - HTTPS=true
      - HTTPS_PORT=1443
      - HTTPS_PORT_2=9443
      - SSL_KEY=/certs/key.pem
      - SSL_CERT=/certs/cert.pem
      - SSL_KEY_2=/certs/key_9443.pem
      - SSL_CERT_2=/certs/cert_9443.pem
      - REALM=DSS-V2-LAB
      - PUBLIC_HOST=10.10.20.120
      - RTSP_PORT=9100
      - ARS_PORT=9500
      - SIP_PORT=5080
      - MEDIAMTX_URL=rtsp://mediamtx:8554
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MEDIAMTX_CAMERA_PATH=cam1
      - MQTT_PORT=1883
      - MQ_ENABLE=1
    networks:
      - dss-network
    restart: unless-stopped
    depends_on:
      - mediamtx

  mediamtx:
    build:
      context: .
      dockerfile: MediaMTX.Dockerfile
    ports:
      - "9100:8554"  # RTSP port (mapped to 9100 for DSS Client)
      - "1935:1935"  # RTMP
      - "8888:8888"  # HLS
      - "8889:8889"  # WebRTC
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - dss-network
    restart: unless-stopped

  p2p-probe:
    build:
      context: ./p2p-probe
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - EASY4IP_HOST=www.easy4ip.com
    restart: "no"
    profiles:
      - tools

networks:
  dss-network:
    driver: bridge