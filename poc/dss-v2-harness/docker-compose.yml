services:
  brms-gateway:
    build:
      context: ./brms-gateway
      dockerfile: Dockerfile
    ports:
      - "1443:1443"
      - "9443:9443"
      - "11443:11443"
      - "18800:18800/udp"
      - "19800:19800/udp"
      - "5080:5080/udp"
      - "5080:5080"    # E-130: SIP TCP (DPSDK 'tcp start server' 0xc56d30)
      - "5061:5061"    # E-130: SIP over TLS (DPSDK 'tls start server' 0xc56528)
      - "9500:9500"  # ARS TCP (DVRIP/DHIP) for NVR auto-registration
      - "1883:1883"  # E-039: MQTT notify broker (dual push, brms.notify* topics)
      - "9100:9100"  # E-134 D3: RTSP relay e115 - StartVideo URLs point at host:9100;
                     # the relay translates ?token= -> /trackID=N for MediaMTX
    volumes:
      - ../certs:/certs:ro
      # E-032: the device registry (data/devices.json) MUST survive a container
      # recreation (image rebuild + `up -d`), otherwise every operator device
      # vanishes from the tree after each deploy. The bind mount also matches
      # the path used by the local dev server (brms-gateway/data/devices.json).
      - ./brms-gateway/data:/app/data
      # E-176: the gateway source is a bind mount so a container recreation
      # (`up -d`, host reboot) can never silently roll the code back to the
      # image's stale copy. Every restart used to lose the ARS/RTSP fixes.
      - ./brms-gateway/src:/app/src
    environment:
      - PORT=11443
      - HTTPS=true
      - HTTPS_PORT=1443
      - HTTPS_PORT_2=9443
      - SSL_KEY=/certs/key.pem
      - SSL_CERT=/certs/cert.pem
      - SSL_KEY_2=/certs/key_9443.pem
      - SSL_CERT_2=/certs/cert_9443.pem
      - REALM=DSS-V2-LAB
      # E-184: los equipos Dahua se registran desde WAN (ARS 9500). El ACK de
      # registro y las URLs RTSP entregadas al cliente deben apuntar a la IP
      # publica, no al host de la LAN.
      - PUBLIC_HOST=200.54.10.52
      - RTSP_PORT=9100
      - ARS_PORT=9500
      - SIP_PORT=5080
      - MEDIAMTX_URL=rtsp://mediamtx:8554
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MEDIAMTX_CAMERA_PATH=cam1
      - MQTT_PORT=1883
      - MQ_ENABLE=1
      # E-040: ActiveMQ Classic (same version the DSS server package ships).
      # OpenWire 61616 is what the native client's MSG.exe really dials
      # (production pcap); the gateway publishes notify via STOMP 61613.
      - AMQ_HOST=activemq
      - AMQ_PORT=61616
      - AMQ_STOMP_PORT=61613
      - AMQ_ENABLE=1
      - AMQ_LOGIN=admin
      - AMQ_PASSWORD=admin
    networks:
      - dss-network
    restart: unless-stopped
    depends_on:
      - mediamtx
      - activemq

  # E-040: REAL message bus of the DSS notify channel. The production client
  # (MSG.exe) connects OpenWire to <server>:61616 - see the production pcap
  # (TLS+OpenWire on 61616, zero traffic on 1883) and the desensambled
  # CMQSDKManager::MQInit (failover:(ssl://%s) with MQConfig verbatim +
  # GetMqConfig now serves MQConfig "<PUBLIC_HOST>:61616", MQType != "mqtt",
  # SSLEnable 0; the gateway pushes brms.notify* to /topic/... via STOMP.
  activemq:
    image: apache/activemq-classic:6.2.0
    ports:
      - "61616:61616"  # OpenWire over TLS (MSG.exe dials ssl:// here)
      - "61613:61613"  # STOMP (gateway publishes notify topics here)
    environment:
      # lab-only broker credentials (image defaults); GetMqConfig serves the
      # same MQUser/MQPwd to the client
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=admin
    volumes:
      # E-087: MSG.exe (CMQSDKManager::MQInit) always builds
      # failover:(ssl://<addr>:61616) and sets
      # decaf.net.ssl.disablePeerVerification -> serve the TLS OpenWire
      # connector with the lab System CA certificate. The PKCS12 keystore
      # lives outside the repo (~/certs/activemq.p12, built from
      # certs/cert.pem+key.pem+ca-cert.pem). Lab-only keystore password.
      - ../certs/activemq.p12:/opt/apache-activemq/ssl/activemq.p12:ro
      - ./activemq-ssl.xml:/opt/apache-activemq/conf/activemq.xml:ro
    networks:
      - dss-network
    restart: unless-stopped

  mediamtx:
    build:
      context: .
      dockerfile: MediaMTX.Dockerfile
    ports:
      - "18554:8554"  # E-134 D3: host 9100 now belongs to the brms-gateway RTSP
                      # relay; MediaMTX RTSP is exposed on 18554 for direct ops
      - "1935:1935"  # RTMP
      - "8888:8888"  # HLS
      - "8889:8889"  # WebRTC
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - dss-network
    restart: unless-stopped

  p2p-probe:
    build:
      context: ./p2p-probe
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - EASY4IP_HOST=www.easy4ip.com
    restart: "no"
    profiles:
      - tools

networks:
  dss-network:
    driver: bridge