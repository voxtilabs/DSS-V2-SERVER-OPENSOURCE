# MediaMTX configuration for DSS V2 H.265 real streaming
# Minimal config for v1.11.3

# RTSP settings
rtspAddress: :8554

# RTMP settings
rtmpAddress: :1935

# HLS settings
hlsAddress: :8888
hlsAlwaysRemux: true
hlsSegmentCount: 5
hlsSegmentDuration: 2s
hlsPartDuration: 500ms
hlsEncryption: false

# WebRTC settings
webrtcAddress: :8889
webrtcICEServers: []

# API settings
api: yes
apiAddress: :9997

# Control API access: the brms-gateway container (compose network 172.18.0.0/16)
# manages paths programmatically (E-034). MediaMTX only grants API rights to
# localhost by default, which is why the gateway got 401. Grant by SOURCE IP -
# no credentials are stored in this repository.
authInternalUsers:
  # publish/read/playback stay OPEN to every source (MediaMTX defaults): the
  # native DSS Client reads rtsp://<host>:9100/cam_<code>?token=... from the
  # LAN - restricting read to the docker net made every external DESCRIBE 401.
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  # API/metrics only from the compose network, where the gateway lives.
  - user: any
    pass:
    ips: [172.18.0.0/16]
    permissions:
      - action: api
      - action: metrics

# Metrics settings
metricsAddress: :9998
metrics: true

# Log settings
logLevel: info

# Path configurations
paths:
  test:
    source: publisher
    runOnInit: ffmpeg -re -f lavfi -i "testsrc2=size=1920x1080:rate=25" -c:v libx265 -preset ultrafast -tune zerolatency -x265-params "keyint=25:min-keyint=25:no-scenecut=1" -pix_fmt yuv420p -f rtsp rtsp://localhost:8554/test
    runOnInitRestart: true

  cam1:
    # Real ONVIF camera stream pulled from 192.168.0.238:8554/EBA1_LECTOR
    # The camera does NOT expose RTSP on port 554, so we proxy it via MediaMTX.
    source: rtsp://192.168.0.238:8554/EBA1_LECTOR
