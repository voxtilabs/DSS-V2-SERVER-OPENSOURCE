name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs-integrity:
    name: Documentación obligatoria + política de evidencia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar documentación obligatoria
        run: |
          set -euo pipefail
          missing=0
          for f in docs/ARCHITECTURE.md docs/ROADMAP.md docs/RESEARCH.md \
                   docs/DAHUA_COMPATIBILITY.md docs/P2P_RESEARCH.md \
                   docs/DSS_CLIENT_RESEARCH.md docs/NETWORK_PROTOCOLS.md \
                   docs/SECURITY.md docs/PERFORMANCE.md docs/DECISIONS.md; do
            if [ ! -f "$f" ]; then echo "::error::Falta documento obligatorio: $f"; missing=1; fi
          done
          exit $missing

      - name: No versionar evidencia ni binarios SDK
        run: |
          set -euo pipefail
          bad=$(find research/evidence -type f ! -name 'README.md' 2>/dev/null || true)
          if [ -n "$bad" ]; then echo "::error::Evidencia no debe versionarse:"; echo "$bad"; exit 1; fi
          if git ls-files '*.exe' '*.dll' '*.so' | grep -q .; then
            echo "::error::Binarios no permitidos en git"; git ls-files '*.exe' '*.dll' '*.so'; exit 1
          fi
          echo "OK: repositorio limpio"

      - name: Resumen de ledger de evidencias
        run: |
          echo "## Ledger docs/RESEARCH.md" >> $GITHUB_STEP_SUMMARY
          grep -E '^\| EV-' docs/RESEARCH.md | sed 's/^/  /' >> $GITHUB_STEP_SUMMARY || true
